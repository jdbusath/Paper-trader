name: Polymarket Paper Trader
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run paper trader
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python paper_trader.py
      - name: Save state
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json trades.csv paper_trader.db
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push